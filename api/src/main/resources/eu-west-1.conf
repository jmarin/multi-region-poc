include "application"

# EU-West-1 Region Configuration
pekko {
  remote.artery {
    canonical {
      hostname = "127.0.0.1"
      port = 2552
    }
  }
  
  cluster {
    seed-nodes = [
      "pekko://FileManager@127.0.0.1:2551",
      "pekko://FileManager@127.0.0.1:2552",
      "pekko://FileManager@127.0.0.1:2553"
    ]
    
    multi-data-center {
      self-data-center = "eu-west-1"
    }
  }
  
  persistence {
    typed.replicated-event-sourcing {
      self-replica-id = "eu-west-1"
    }
  }
}

slick.db {
  url = "jdbc:postgresql://localhost:5433/filemanager_eu_west_1"
  user = "filemanager"
  password = "filemanager123"
}

filemanager {
  region = "eu-west-1"
  
  http {
    port = 8082
  }
  
  grpc {
    port = 9091
  }
  
  storage {
    endpoint = "http://localhost:9001"
    bucket = "filemanager-eu-west-1"
    access-key = "minioadmin"
    secret-key = "minioadmin123"
    region = "eu-west-1"
  }
}
