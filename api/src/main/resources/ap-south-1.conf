include "application"

# AP-South-1 Region Configuration
pekko {
  remote.artery {
    canonical {
      hostname = "127.0.0.1"
      port = 2553
    }
  }
  
  cluster {
    seed-nodes = [
      "pekko://FileManager@127.0.0.1:2551",
      "pekko://FileManager@127.0.0.1:2552",
      "pekko://FileManager@127.0.0.1:2553"
    ]
    
    multi-data-center {
      self-data-center = "ap-south-1"
    }
  }
  
  persistence {
    typed.replicated-event-sourcing {
      self-replica-id = "ap-south-1"
    }
  }
}

slick.db {
  url = "jdbc:postgresql://localhost:5434/filemanager_ap_south_1"
  user = "filemanager"
  password = "filemanager123"
}

filemanager {
  region = "ap-south-1"
  
  http {
    port = 8083
  }
  
  grpc {
    port = 9092
  }
  
  storage {
    endpoint = "http://localhost:9002"
    bucket = "filemanager-ap-south-1"
    access-key = "minioadmin"
    secret-key = "minioadmin123"
    region = "ap-south-1"
  }
}
