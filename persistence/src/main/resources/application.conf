pekko {
  loglevel = "INFO"
  
  actor {
    provider = cluster
    
    serialization-bindings {
      # CBOR serialization for events, commands, and state
      "com.jmarin.filemanager.CborSerializable" = jackson-cbor
    }
  }
  
  http {
    server {
      idle-timeout = 60s
      request-timeout = 30s
    }
  }
  
  grpc {
    client {
      use-tls = false
    }
  }
  
  cluster {
    shutdown-after-unsuccessful-join-seed-nodes = 30s
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }
  
  persistence {
    journal.plugin = "jdbc-journal"
    snapshot-store.plugin = "jdbc-snapshot-store"
    
    # Replicated Event Sourcing configuration
    typed.replicated-event-sourcing {
      # Replica IDs for all regions
      replicas = ["us-east-1", "eu-west-1", "ap-south-1"]
      
      # Fast lane for replication
      replication-transport-settings {
        parallel-updates = 8
      }
    }
  }
}

jdbc-journal {
  slick = ${slick}
  
  tables {
    event_journal {
      tableName = "event_journal"
      schemaName = ""
      columnNames {
        ordering = "ordering"
        deleted = "deleted"
        persistenceId = "persistence_id"
        sequenceNumber = "sequence_number"
        created = "created"
        tags = "tags"
        message = "message"
      }
    }
  }
  
  tagSeparator = ","
}

jdbc-snapshot-store {
  slick = ${slick}
  
  tables {
    snapshot {
      tableName = "snapshot"
      schemaName = ""
      columnNames {
        persistenceId = "persistence_id"
        sequenceNumber = "sequence_number"
        created = "created"
        snapshot = "snapshot"
      }
    }
  }
}

jdbc-read-journal {
  slick = ${slick}
  
  tables {
    event_journal = ${jdbc-journal.tables.event_journal}
  }
  
  tagSeparator = ","
  refresh-interval = 1s
  max-buffer-size = 500
}

pekko-persistence-jdbc {
  shared-databases {
    default {
      profile = "slick.jdbc.PostgresProfile$"
      db {
        driver = "org.postgresql.Driver"
        numThreads = 20
        maxConnections = 20
        minConnections = 5
        connectionTimeout = 5000
      }
    }
  }
}

slick {
  profile = "slick.jdbc.PostgresProfile$"
  db {
    driver = "org.postgresql.Driver"
    numThreads = 20
    maxConnections = 20
    minConnections = 5
    connectionTimeout = 5000
  }
}

# Application-specific configuration
filemanager {
  # HTTP API configuration
  http {
    interface = "0.0.0.0"
    port = 8080
  }
  
  # gRPC service configuration
  grpc {
    interface = "0.0.0.0"
    port = 9090
  }
}
