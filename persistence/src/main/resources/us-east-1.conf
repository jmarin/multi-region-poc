include "application"

# US-East-1 Region Configuration
pekko {
  remote.artery {
    canonical {
      hostname = "127.0.0.1"
      port = 2551
    }
  }
  
  cluster {
    seed-nodes = [
      "pekko://FileManager@127.0.0.1:2551",
      "pekko://FileManager@127.0.0.1:2552",
      "pekko://FileManager@127.0.0.1:2553"
    ]
    
    multi-data-center {
      self-data-center = "us-east-1"
    }
  }
  
  persistence {
    typed.replicated-event-sourcing {
      self-replica-id = "us-east-1"
    }
  }
}

slick.db {
  url = "jdbc:postgresql://localhost:5433/filemanager_us_east_1"
  user = "filemanager"
  password = "filemanager123"
}

filemanager {
  region = "us-east-1"
  
  http {
    port = 8081
  }
  
  grpc {
    port = 9090
  }
  
  storage {
    endpoint = "http://localhost:9000"
    bucket = "filemanager-us-east-1"
    access-key = "minioadmin"
    secret-key = "minioadmin123"
    region = "us-east-1"
  }
}
